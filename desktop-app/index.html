<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Mesh Video LAN</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="topbar">

      <h1>Mesh Video LAN</h1>

      <input id="roomInput" placeholder="ROOM ID">

      <button id="joinBtn">JOIN</button>

      <button id="muteBtn">🎤</button>
      <button id="cameraBtn">📷</button>
      <button id="leaveBtn">LEAVE</button>

      <button id="ecgBtn">ECG ON</button>

      <button id="fullscreenBtn">
        FULL ECG
      </button>

      <button id="roleBtn">
        ROLE: TX
      </button>

    </div>

    <div class="main-layout">

      <div id="wanPanel" class="wan-panel" style="display:none;">
        <div class="wan-title">LINKS</div>
        <div class="wan-item" id="wanSatellite">
          <span class="wan-indicator"></span>
          <span class="wan-label">Satellite</span>
          <span class="wan-status">--</span>
        </div>
        <div class="wan-item" id="wan5g">
          <span class="wan-indicator"></span>
          <span class="wan-label">5G Link</span>
          <span class="wan-status">--</span>
        </div>
        <div class="wan-item" id="wanWifi">
          <span class="wan-indicator"></span>
          <span class="wan-label">WIFI MESH</span>
          <span class="wan-status">--</span>
        </div>
      </div>

      <div class="content-area">

      <div class="videos">

        <div class="video-wrapper">
          <div class="video-title">LOCAL</div>
          <video id="localVideo" autoplay muted playsinline></video>
        </div>

        <div class="video-wrapper">
          <div class="video-title">REMOTE</div>
          <video id="remoteVideo" autoplay playsinline></video>
        </div>

      </div>

      <div class="ecg-container">
        <canvas id="ecgCanvas"></canvas>
      </div>

      </div>

    </div>

    <script src="renderer.js"></script>

</body>

</html>
